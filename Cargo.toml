[package]
name = "qmoe_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = { path = "resources/candle/candle-core" }
candle-nn = { path = "resources/candle/candle-nn" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
safetensors = "0.7.0"
memmap2 = "0.9.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.22.0"

[[bin]]
name = "eval"
path = "src/bin/eval.rs"
