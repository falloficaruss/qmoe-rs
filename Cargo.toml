[package]
name = "qmoe_engine"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
criterion = { version = "0.5", features = ["csv_output"] }
rand = "0.8"

[[bench]]
name = "simd_kernel"
harness = false

[[bench]]
name = "packed_tensor"
harness = false

[[bench]]
name = "moe_layer"
harness = false

[[bench]]
name = "attention"
harness = false

[features]
fused_attn = []

[dependencies]
candle-core = { git = "https://github.com/falloficaruss/candle", branch = "qmoe-openblas", features = ["openblas"] }
candle-nn = { git = "https://github.com/falloficaruss/candle", branch = "qmoe-openblas", features = ["openblas"] }
openblas-src = { version = "0.10", features = ["system"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
safetensors = "0.7.0"
memmap2 = "0.9.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.22.0"

[[bin]]
name = "eval"
path = "src/bin/eval.rs"
